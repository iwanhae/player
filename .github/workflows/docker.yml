# Build the app's Docker image and push it to ghcr.io/iwanhae/player.
# Runs on pushes to main that change the image/app files (paths filter), on
# v* tags (releases; path filters are not evaluated for tag pushes), and on
# manual dispatch. Image tags/labels come from docker/metadata-action and
# build layers are cached in the GitHub Actions cache.

name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'app/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/iwanhae/player
          # main pushes:          latest + main-<short sha>
          # v* tag pushes:        1.2.3 / 1.2 / 1 + latest (from latest=auto flavor)
          # non-default branches: branch name (e.g. via workflow_dispatch)
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch,enable={{is_not_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
